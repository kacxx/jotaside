name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release PRs are opened with the default token, which starts no workflows,
  # so CI is run on them by hand: gh workflow run CI --ref <release branch>
  workflow_dispatch:

permissions:
  contents: read

# One run per PR branch: a new push cancels the PR's run in progress. Pushes to
# main and manual runs each get their own group (run_id), so none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

      # The race detector needs cgo and a C toolchain; the Windows job is here
      # for path, permission and SQLite-on-Windows behaviour.
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # End-to-end check of the documented flow against the built binary:
      # install -> paths -> CLI round-trip -> per-agent hook capture/passthrough
      # -> MCP initialize. Installs from this checkout and uses a throwaway DB.
      - name: End-to-end install and hook flow
        run: bash test/e2e/run.sh

  # The release archives ship THIRD_PARTY_NOTICES, so a dependency change that
  # doesn't regenerate it fails here rather than shipping stale notices.
  notices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: THIRD_PARTY_NOTICES matches go.mod
        run: bash scripts/third-party-notices.sh --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Config in .golangci.yml. Pinned so a new linter release can't turn CI
      # red on its own; bump it here and in scripts/check.sh together.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # gofmt, golangci-lint, shellcheck and the plugin manifest lint, as
      # locally. CI=true, so a missing linter fails rather than being skipped.
      - name: Lint (scripts/check.sh --lint-only)
        run: bash scripts/check.sh --lint-only

      - name: Manifest lint tests
        run: bash ci/__tests__/lint-skills.test.sh
