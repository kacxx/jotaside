version: 2

project_name: jotaside

builds:
  - id: jotaside
    main: ./cmd/jotaside
    binary: jotaside
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - id: jotaside
    formats: [tar.gz]
    name_template: "jotaside_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# release-please creates the GitHub release and its notes; GoReleaser only
# attaches the archives and checksums to it.
release:
  mode: keep-existing
